<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ShopEasy - Online Shopping</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f5f5f5;
}

/* Navbar */

nav{
background:#222;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 60px;
}

nav h2{
color:#ff7a18;
}

nav ul{
display:flex;
list-style:none;
}

nav ul li{
margin-left:25px;
}

nav ul li a{
color:white;
text-decoration:none;
font-weight:bold;
}

nav ul li a:hover{
color:#ff7a18;
}

/* Hero */

.hero{
height:350px;
background:linear-gradient(120deg,#ff7a18,#ffb347);
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}

.hero h1{
font-size:45px;
}

/* Section */

section{
padding:60px;
}

.title{
text-align:center;
margin-bottom:40px;
font-size:32px;
}

/* Products */

.products{
display:flex;
flex-wrap:wrap;
gap:30px;
justify-content:center;
}

.product{
background:white;
padding:20px;
width:240px;
border-radius:8px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
transition:0.3s;
}

.product:hover{
transform:translateY(-8px);
}

.product img{
width:100%;
height:180px;
object-fit:cover;
border-radius:6px;
}

.product h3{
margin:10px 0;
}

.price{
color:#ff7a18;
font-weight:bold;
}

button{
margin-top:10px;
padding:8px 15px;
background:#ff7a18;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#e86500;
}

/* Footer */

footer{
background:#222;
color:white;
text-align:center;
padding:20px;
margin-top:40px;
}

</style>

</head>

<body>


<nav>

<h2>ShopEasy</h2>

<ul>
<li><a href="#">Home</a></li>
<li><a href="#">Products</a></li>
<li><a href="#">Categories</a></li>
<li><a href="#">Cart</a></li>
<li><a href="#">Contact</a></li>
</ul>

</nav>



<div class="hero">

<div>
<h1>Welcome to ShopEasy</h1>
<p>Best deals on electronics, fashion and accessories</p>
</div>

</div>



<section>

<h2 class="title">Featured Products</h2>

<div class="products">


<div class="product">
<img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8">
<h3>Laptop</h3>
<p class="price">$899</p>
<button>Add to Cart</button>
</div>


<div class="product">
<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9">
<h3>Smartphone</h3>
<p class="price">$499</p>
<button>Add to Cart</button>
</div>


<div class="product">
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e">
<h3>Headphones</h3>
<p class="price">$59</p>
<button>Add to Cart</button>
</div>


<div class="product">
<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">
<h3>Smart Watch</h3>
<p class="price">$129</p>
<button>Add to Cart</button>
</div>


<div class="product">
<img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f">
<h3>Camera</h3>
<p class="price">$599</p>
<button>Add to Cart</button>
</div>


<div class="product">
<img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d">
<h3>Running Shoes</h3>
<p class="price">$79</p>
<button>Add to Cart</button>
</div>


</div>

</section>



<footer>

<p>© 2026 ShopEasy Online Store</p>

</footer>


</body>
</html>
